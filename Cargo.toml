[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
axum = "0.8"
argon2 = "0.6"
async-trait = "0.1"
chrono = "0.4"
dotenvy = "0.15"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "mysql-rsa", "migrate", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
